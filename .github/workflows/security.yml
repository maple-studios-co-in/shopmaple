name: Security checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:dependencies

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p security-bin
          tar -xzf gitleaks.tar.gz -C security-bin gitleaks
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Scan complete fetched history with redacted output
        run: gitleaks git --redact --no-banner --log-opts=--all .

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Semgrep Community Edition
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install --disable-pip-version-check semgrep==1.182.0
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Scan source locally without uploading code or metrics
        run: semgrep scan --config p/javascript --config p/typescript --config p/nodejs --metrics=off --disable-version-check --error --strict apps packages scripts
