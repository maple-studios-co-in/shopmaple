name: Verify storefront foundation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PG_BIN_DIRECTORY: /usr/lib/postgresql/17/bin
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopmaple
          POSTGRES_PASSWORD: shopmaple
          POSTGRES_DB: shopmaple
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U shopmaple"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL 17 recovery clients
        run: |
          if test -x /usr/lib/postgresql/17/bin/pg_dump && test -x /usr/lib/postgresql/17/bin/pg_restore; then exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/shopmaple-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Prepare dedicated test database
        env:
          PGPASSWORD: shopmaple
        run: |
          createdb -h 127.0.0.1 -p 55439 -U shopmaple shopmaple_test
          DATABASE_URL=postgresql://shopmaple:shopmaple@127.0.0.1:55439/shopmaple_test npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          createdb -h 127.0.0.1 -p 55439 -U shopmaple shopmaple_preview_import_test
          DATABASE_URL=postgresql://shopmaple:shopmaple@127.0.0.1:55439/shopmaple_preview_import_test npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run catalog:import
      - run: npm test
      - run: npm run test:deploy:db
        env:
          PREVIEW_IMPORT_TEST_DATABASE_URL: postgresql://shopmaple:shopmaple@127.0.0.1:55439/shopmaple_preview_import_test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:homepage-payload
